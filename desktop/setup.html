<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'"><title>에이전트 메신저 시작</title><style>
*{box-sizing:border-box}body{margin:0;padding:36px;background:#f7f8fa;color:#191f28;font:15px/1.65 -apple-system,'Malgun Gothic',sans-serif}h1{font-size:26px}p{color:#6b7684}label{display:block;margin:14px 0 5px}input,select,button{font:inherit;border:1px solid #e5e8eb;border-radius:12px;padding:12px;width:100%;background:white}button{cursor:pointer;background:#2272eb;color:white;border:0;margin-top:18px}.row{display:flex;gap:8px}.row button{width:100px;margin:0;flex:none}#error{color:#c22;white-space:pre-wrap}small{color:#6b7684}</style></head><body><h1>에이전트 메신저</h1><p>처음 한 번 연결하면 앱이 에이전트를 함께 실행해요.</p><form id="setup"><label for="server">팀 서버 주소</label><input id="server" value="http://localhost:3000" required><label for="name">이름</label><input id="name" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><label for="tool">이 컴퓨터의 에이전트</label><select id="tool"><option value="codex">Codex (GPT)</option><option value="claude">Claude</option></select><label for="folder">작업할 저장소 폴더</label><div class="row"><input id="folder" readonly required><button id="choose" type="button">폴더 선택</button></div><small>Codex 또는 Claude CLI가 설치되어 로그인되어 있어야 해요.</small><button id="submit">연결하고 시작</button><p id="error" role="alert"></p></form><script src="setup.js"></script></body></html>
